name: build tenSEAL for radxa (debian 12 AArch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up QEMU untuk ARM64
        uses: docker/setup-qemu-action@v3

      - name: siapkan folder output
        run: mkdir -p ${{ github.workspace }}/output

      - name: bangun wheel di dalam container Debian 12 ARM64
        run: |
          docker run --rm -v ${{ github.workspace }}/output:/output arm64v8/debian:bookworm bash -c "
            echo 'memperbarui sistem debian 12' &&
            apt-get update &&
            
            echo 'menginstal tools kompilasi c++ dan python 3.11' &&
            apt-get install -y python3.11 python3.11-venv python3.11-dev build-essential cmake git curl &&
            
            echo 'membuat venv' &&
            python3.11 -m venv /venv &&
            /venv/bin/pip install --upgrade pip &&
            
            echo 'mengompilasi' &&
            /venv/bin/pip wheel tenseal==0.3.17 --no-binary tenseal -w /output &&
            
            echo 'selesai'
          "

      - name: upload file wheel
        uses: actions/upload-artifact@v4
        with:
          name: tenseal-radxa-wheel
          path: output/*.whl
